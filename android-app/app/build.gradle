plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tracememory.tracetodo'
    compileSdk 34

    defaultConfig {
        applicationId "com.tracememory.tracetodo"
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName "1.4.4"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
