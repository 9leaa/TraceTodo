[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-memory"
version = "0.1.0"
description = "Traceable, Self-Evolving Hybrid Memory & Eisenhower Task Matrix System for AI Agents (Fusing suixinji, basic-memory, and ReMe)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
full = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "qdrant-client>=1.9.0",
    "openai>=1.30.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
tm = "trace_memory.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"trace_memory.api" = ["*.html", "*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
